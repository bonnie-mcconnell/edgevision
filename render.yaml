# Render Blueprint - deploys the ONNX (YOLOv8n) backend + a managed Redis
# instance. The Dockerfile's builder stage exports yolov8n.onnx at image
# build time, so no manual model upload/volume mount is needed.

# No VIDEO_SOURCE is set deliberately - there's no camera on a cloud server,
# so /ws/detections has nothing to stream from, but /health, /docs, /live,
# /demo/detect, /alerts/recent, and /benchmark/results all work without one.

services:
  - type: web
    name: edgevision
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DETECTOR_BACKEND
        value: onnx
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: edgevision-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: edgevision-redis
          property: port

  - type: keyvalue
    name: edgevision-redis
    plan: free
    ipAllowList: []