name: tests

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
        
            - uses: actions/setup-python@v5
              with:
                python-version: "3.12"
                cache: "pip"

            - name: Install runtime + test dependencies
              run: pip install -r requirements.txt -r requirements-dev.txt

            - name: Build the demo ONNX model
              run: python scripts/make_demo_model.py
              # test_detector.py constructor tests need any valid ONNX file

            - name: Run tests
              run: |
                pip install pytest-cov
                pytest tests/ -v --cop=app --cov-report=term-missing