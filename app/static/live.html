<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>EdgeVision - live view</title>
  <style>
    body { background: #111; color: #eee; font-family: monospace; text-align: center; }
    canvas { border: 2px solid #444; margin-top: 12px; }
    #alert-banner {
      font-size: 24px; font-weight: bold; color: #ff4444;
      height: 32px; visibility: hidden;
    }
    #status { color: #888; margin-top: 8px; }
  </style>
</head>
<body>
  <h2>EdgeVision - live detection view</h2>
  <div id="alert-banner">ALERT FIRED</div>
  <canvas id="canvas" width="640" height="480"></canvas>
  <div id="status">connecting...</div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const banner = document.getElementById("alert-banner");
    const status = document.getElementById("status");

    const wsUrl = `ws://${location.host}/ws/detections?include_frame=true`;
    const ws = new WebSocket(wsUrl);

    ws.onopen = () => { status.textContent = "connected"; };
    ws.onclose = () => { status.textContent = "disconnected"; };
    ws.onerror = () => { status.textContent = "error - is the server running with a real webcam?"; };

    function colorForTrack(trackId) {
      const hue = (trackId * 137.5) % 360;
      return `hsl(${hue}, 85%, 55%)`;
    }

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      status.textContent = `${data.detections.length} detected | ${data.inference_ms}ms`;

      if (!data.frame) {
        return;
      }

      const img = new Image();
      img.onload = () => {
        // draw the camera frame first
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        if (data.zone) { // read from servers payload
          const z = data.zone
          // draw the alert zone
          ctx.strokeStyle = "yellow";
          ctx.lineWidth = 2;
          ctx.strokeRect(z.x1, z.y1, z.x2 - z.x1, z.y2 - z.y1);
        }

        // draw each tracked detection, colour-coded by track ID
        ctx.font = "16px monospace";
        for (const d of data.detections) {
          const [x1, y1, x2, y2] = d.box;
          const color = colorForTrack(d.track_id);

          ctx.strokeStyle = color;
          ctx.lineWidth = 2;
          ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

          const label = `#${d.track_id} ${d.label} ${d.confidence.toFixed(2)}`;
          const textY = Math.max(y1 - 6, 14);

          const textWidth = ctx.measureText(label).width;
          ctx.fillStyle = color;
          ctx.fillRect(x1, textY - 14, textWidth + 6, 18);

          ctx.fillStyle = "#111";
          ctx.fillText(label, x1 + 3, textY);
        }
      };
      img.src = "data:image/jpeg;base64," + data.frame;

      // flash the alert banner briefly if one fired this frame
      if (data.alerts && data.alerts.length > 0) {
        banner.style.visibility = "visible";
        setTimeout(() => { banner.style.visibility = "hidden"; }, 1500);
      }
    };
  </script>
</body>
</html>
