services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - DETECTOR_BACKEND=onnx
      # - VIDEO_SOURCE=0
      # to pass a host webcam through, uncomment the line above and add
      # devices: ["/dev/video0:/dev/video0"] below (Linux only)
    depends_on:
      redis:
        condition: service_healthy